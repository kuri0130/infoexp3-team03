<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MiniBoard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main>
        <header class="app-header">
            <span class="icon">💬</span>
            <h1>MiniBoard</h1>
            <p class="subtitle">チームで育てる掲示板アプリ</p>
        </header>

        <form id="form">
            <h2>新規投稿</h2>
            <input id="name" maxlength="30" placeholder="ニックネーム" required>
            <textarea id="message" maxlength="300" placeholder="メッセージを入力してください..." required></textarea>
            <button type="submit">投稿する</button>
        </form>

        <p id="status"></p>

        <section class="messages-container">
            <h2>投稿一覧</h2>
            <div id="messages"></div>
        </section>
    </main>
    <script src="/static/app.js"></script>
</body>

</html>
