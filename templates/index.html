
<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MiniBoard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main class="container">

        <header class="app-header">
            <div class="logo">💬</div>
            <h1>MiniBoard</h1>
            <p class="subtitle">みんなの声が集まる、小さな掲示板。</p>
        </header>

        <form id="form" class="post-form">
            <h2>✏️ 新しい投稿</h2>

            <label for="name">ニックネーム</label>
            <input id="name" maxlength="30"
                placeholder="名前を入力してください" required>
            <div class="char-count" data-for="name" aria-live="polite">0 / 30</div>

            <label for="message">メッセージ</label>
            <textarea id="message" maxlength="300"
                placeholder="みんなに伝えたいことを書いてみましょう..."
                required></textarea>
            <div class="char-count" data-for="message" aria-live="polite">0 / 300</div>
            <div class="image-row">
                <label class="image-picker">
                    🖼 画像を添付（2枚まで）
                    <input id="images" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
                </label>
                <span class="image-count" aria-live="polite">0 / 2枚</span>
            </div>
            <div id="image-previews"></div>

            <button type="submit">投稿する →</button>
        </form>

        <p id="status"></p>

        <section class="messages-container">
            <div class="section-header">
                <h2>📋 みんなの投稿</h2>
                <span class="section-label">MESSAGE BOARD</span>
            </div>

            <div id="messages"></div>
        </section>

        <footer>
            <p>MiniBoard © 2026</p>
        </footer>

    </main>

    <script src="/static/app.js"></script>
</body>

</html>
