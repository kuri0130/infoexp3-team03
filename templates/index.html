<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MiniBoard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/danmaku.css">
    <link rel="stylesheet" href="/static/omikuji.css">
</head>

<body>
    <main class="container">

        <header class="app-header">
            <div class="logo">💬</div>
            <h1>MiniBoard</h1>
            <p class="subtitle">ドーパミン補給中。投稿・リアクション・弾幕で脳汁全開！</p>
            <div class="header-fun-actions">
                <button type="button" id="toggle-danmaku" class="fun-toggle-button" aria-pressed="false">
                    <span class="fun-toggle-icon" aria-hidden="true">🎇</span>
                    <span class="fun-toggle-text">弾幕モード: OFF</span>
                    <span class="fun-toggle-badge">画面にコメントが流れる！</span>
                </button>
            </div>
        </header>

        <section class="threads-container">
            <div class="section-header">
                <h2>🧵 スレッド一覧</h2>
                <button type="button" id="toggle-thread-form" class="new-thread-button">＋ スレッドを立てる</button>
            </div>

            <form id="thread-form" class="thread-form" hidden>
                <label for="thread-title">スレッドタイトル</label>
                <input id="thread-title" maxlength="60"
                    placeholder="話したいテーマを入力してください" required>
                <div class="char-count" data-for="thread-title" aria-live="polite">0 / 60</div>

                <label for="thread-name">ニックネーム（任意）</label>
                <input id="thread-name" maxlength="30"
                    placeholder="名前を入力してください（空欄で「匿名」）">
                <div class="char-count" data-for="thread-name" aria-live="polite">0 / 30</div>

                <label for="thread-message">最初のメッセージ（任意）</label>
                <textarea id="thread-message" maxlength="300"
                    placeholder="スレッドの最初の投稿を書いてみましょう..."></textarea>
                <div class="char-count" data-for="thread-message" aria-live="polite">0 / 300</div>

                <div class="thread-form-actions">
                    <button type="submit">スレッドを立てる →</button>
                    <button type="button" id="cancel-thread-form" class="cancel-button">キャンセル</button>
                </div>
            </form>

            <section class="topic-roulette" aria-labelledby="topic-roulette-heading">
                <h3 id="topic-roulette-heading">🎲 お題ガチャ</h3>
                <p>お題を引いて、みんなで話すスレッドを作ってみましょう。</p>
                <div id="topic-result" class="topic-result" aria-live="polite">
                    「お題を引く」を押してください
                </div>
                <div class="topic-actions">
                    <button type="button" id="draw-topic-button">🎲 お題を引く</button>
                    <button type="button" id="use-topic-button" hidden>このお題でスレッドを作る</button>
                </div>
            </section>

            <div id="threads" class="thread-list"></div>
        </section>

        <form id="form" class="post-form">
            <h2>✏️ 新しい投稿</h2>
            <p id="current-thread-badge" class="current-thread-badge"></p>

            <label for="name">ニックネーム（任意）</label>
            <input id="name" maxlength="30"
                placeholder="名前を入力してください（空欄で「匿名」）">
            <div class="char-count" data-for="name" aria-live="polite">0 / 30</div>

            <label for="message">メッセージ</label>
            <textarea id="message" maxlength="300"
                placeholder="みんなに伝えたいことを書いてみましょう..."
                required></textarea>
            <div class="char-count" data-for="message" aria-live="polite">0 / 300</div>
            <div class="image-row">
                <label class="image-picker">
                    🖼 画像を添付（2枚まで）
                    <input id="images" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
                </label>
                <span class="image-count" aria-live="polite">0 / 2枚</span>
            </div>
            <div id="image-previews"></div>

            <button type="submit">投稿する →</button>
        </form>

        <p id="status"></p>

        <section class="messages-container">
            <div class="section-header">
                <h2 id="messages-heading">📋 みんなの投稿</h2>
                <span class="section-label">MESSAGE BOARD</span>
            </div>

            <section id="omikuji-panel" class="omikuji-panel" aria-labelledby="omikuji-heading" hidden>
                <div class="omikuji-panel-header">
                    <span class="omikuji-shrine-icon" id="omikuji-shrine-icon" aria-hidden="true">⛩️</span>
                    <div>
                        <h3 id="omikuji-heading">今日の運勢おみくじ</h3>
                        <p class="omikuji-desc">ボタンを押しておみくじを引こう！結果はスレッドに投稿されます（大吉は超派手演出✨）</p>
                    </div>
                </div>
                <div class="omikuji-controls">
                    <button type="button" id="draw-omikuji-button" class="draw-omikuji-button">
                        🎋 おみくじを引く！
                    </button>
                </div>
            </section>

            <div id="messages"></div>
        </section>

        <footer>
            <p>MiniBoard © 2026</p>
        </footer>

    </main>

    <div id="omikuji-overlay" class="omikuji-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="omikuji-modal-title"></div>

    <script type="module" src="/static/js/main.js"></script>
</body>

</html>
